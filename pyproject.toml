[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relay-agent-workspace"
version = "0.1.0"
description = "A local command center for coding sessions, meaningful agent names, and reproducible bugs."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
relay = "relay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
